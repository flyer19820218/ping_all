name: Browser-based Streamlit keep-alive

on:
  schedule:
    # Every four hours, offset from the top of the hour to reduce scheduler delays.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      target_urls:
        description: "Optional: one or more HTTPS app URLs, separated by spaces or commas"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: streamlit-keep-alive
  cancel-in-progress: false

jobs:
  wake-apps:
    name: Wake Streamlit apps in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the keep-alive code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Visit apps and wake sleeping instances
        env:
          # Optional. Store only existing Playwright storage-state JSON in this
          # GitHub Secret when private apps must be visited. Never store a password.
          STREAMLIT_STORAGE_STATE: ${{ secrets.STREAMLIT_STORAGE_STATE }}
          TARGET_URLS: ${{ inputs.target_urls }}
        run: python ping_all.py
